# Sveltia CMS — blog admin at /admin. Setup: README, "Blog admin (/admin)".
# Editor guide: docs/blog-admin-guide.md.
#
# Every save commits to the GitHub repo below; the commit triggers the normal
# Vercel build, which turns the markdown into pages (loadPosts in
# client/src/blog/posts.js). Field names here must match the frontmatter
# that loadPosts reads.

backend:
  name: github
  repo: Manav-p765/SecurityMarketingCompany
  branch: main
  # GitHub login goes through our own API (server/src/routes/auth.js on
  # Render): the CMS opens {base_url}/{auth_endpoint}.
  base_url: https://securitymarketingcompany.onrender.com
  auth_endpoint: api/auth
  auth_methods: [oauth]
  commit_messages:
    create: 'Blog: create "{{slug}}"'
    update: 'Blog: update "{{slug}}"'
    delete: 'Blog: delete "{{slug}}"'
    uploadMedia: 'Blog: upload "{{path}}"'
    deleteMedia: 'Blog: delete "{{path}}"'

site_url: https://www.securitymarketingcompany.com
display_url: https://www.securitymarketingcompany.com
logo_url: /logo/logo-mark.png

# Uploaded images: stored in the repo, served from /images/blog/<file>.
media_folder: client/public/images/blog
public_folder: /images/blog

output:
  # Leave blank optional fields (cover image, slug, related service) out of
  # the file instead of writing empty values.
  omit_empty_optional_fields: true

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    description: Articles published at /blog. Newest first by date.
    folder: client/src/content/blog
    extension: md
    format: frontmatter
    create: true
    delete: true
    # File name (and the post's web address) made from the title.
    slug: '{{slug}}'
    identifier_field: title
    summary: "{{title}}{{draft | ternary(' — DRAFT', '')}}"
    sortable_fields: [date, title, category]
    preview_path: blog/{{slug}}
    fields:
      - name: title
        label: Title
        widget: string
      - name: slug
        label: Web address (optional)
        widget: string
        required: false
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase letters, numbers and hyphens only.']
        hint: >-
          Leave blank to use one made from the title (e.g. a post at /blog/my-post-title).
          Don't change it after publishing — old links would break.
      - name: date
        label: Publish date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: '{{now}}'
        hint: Posts are listed newest first by this date.
      - name: excerpt
        label: Excerpt
        widget: text
        hint: One or two sentences. Shown on the blog cards and used as the Google description.
      - name: category
        label: Category
        widget: relation
        collection: settings
        file: blog
        value_field: categories.*
        search_fields: [categories.*]
        display_fields: [categories.*]
        hint: To add a new category, open Blog Settings (left menu) and add it to the list first.
      - name: coverImage
        label: Cover image (optional)
        widget: image
        required: false
        hint: A wide image works best (16:9). Without one, the post gets a generated graphic.
      - name: author
        label: Author
        widget: string
        default: Security Marketing Company Team
      - name: service
        label: Related service (optional)
        widget: select
        required: false
        hint: The service linked in the box in the middle of the article. Blank = picked from the category.
        options:
          - { label: Website Design & Development, value: website }
          - { label: SEO & AI SEO, value: seo }
          - { label: Paid Ads, value: paid-ads }
          - { label: Social Media Marketing, value: social-media }
          - { label: Email Marketing & Lead Generation, value: email-marketing }
          - { label: Google Business Profile Management, value: google-business-profile }
          - { label: CRM Automation, value: crm-automation }
      - name: draft
        label: Draft
        widget: boolean
        default: false
        hint: While on, the post is saved but not shown on the website.
      - name: body
        label: Article
        widget: markdown
        hint: Use Heading 2 and Heading 3 for sections — the title is already the page heading.

  - name: settings
    label: Blog Settings
    editor:
      preview: false
    files:
      - name: blog
        label: Blog categories
        file: client/src/content/blog-settings.yml
        fields:
          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            hint: Categories offered when writing a post.
