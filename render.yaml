# Render Blueprint for the API. The frontend is deployed separately on Vercel.
# Render dashboard → New → Blueprint → pick this repo. You will be asked for
# the two `sync: false` values.
services:
  - type: web
    name: smc-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string.
      - key: MONGODB_URI
        sync: false
      # The Vercel site's origin(s), comma-separated, no trailing slash,
      # e.g. https://www.securitymarketingcompany.com,https://smc.vercel.app
      - key: CORS_ORIGIN
        sync: false
      # Lead emails via Resend. LEAD_NOTIFY_TO (who gets new leads) is
      # comma-separated. RESEND_FROM is the From of every email the site sends.
      - key: RESEND_API_KEY
        sync: false
      - key: LEAD_NOTIFY_TO
        sync: false
      - key: RESEND_FROM
        value: Security Marketing Company <info@securitymarketingcompany.com>
      # Blog admin (/admin): session signing secret, Cloudinary for images,
      # and the Vercel Deploy Hook that rebuilds the site after publishing.
      # CLOUDINARY_CLOUD_NAME is the Cloudinary "Cloud name" (Settings → API
      # Keys), not the company name. VERCEL_DEPLOY_HOOK_URL is the full URL:
      # https://api.vercel.com/v1/integrations/deploy/prj_XXXX/YYYY
      # /admin's dashboard (System status) checks both.
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VERCEL_DEPLOY_HOOK_URL
        sync: false
